services:
  frontend:
    build:
      context: ./frontend
      target: production
    restart: always

  app:
    build:
      context: .
      dockerfile: dockerfile
    restart: always
    volumes:
      - static-data:/vol/web
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
      SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env}
      DEBUG: "0"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 9000), timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s
    depends_on:
      - db

  db:
    image: postgres:13-alpine
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - static-data:/vol/static
    depends_on:
      frontend:
        condition: service_started
      app:
        condition: service_healthy

volumes:
  postgres-data:
  static-data:
