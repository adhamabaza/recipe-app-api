services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
      - frontend-node-modules:/frontend/node_modules
    environment:
      - API_PROXY_TARGET=http://app:8000
    depends_on:
      - app

  app:
    build: 
      context: .
      args:
        - DEV=true
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app
      - dev-static-data:/vol/web
    command: >
      sh -c "python manage.py wait_for_db  && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=Devdb
      - DB_USER=devuser
      - DB_PASSWORD=changeme
      - DEBUG=1
      - ALLOWED_HOSTS=localhost,127.0.0.1,[::1],app
    depends_on:
      - db

  
  db:
    image: postgres:13-alpine
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=Devdb
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=changeme
  
volumes:
  frontend-node-modules:
  dev-db-data:
  dev-static-data:


    
